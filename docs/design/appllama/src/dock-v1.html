<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* v1 — refined current layout: no dock bar, bottom scrim, white mic w/ accent ring, glass camera pill + glass gallery circle */
.scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: linear-gradient(180deg, rgba(5,7,10,0), rgba(5,7,10,.55) 45%, rgba(5,7,10,.9)); }
.topscrim { position: absolute; left: 0; right: 0; top: 0; height: 150px; background: linear-gradient(180deg, rgba(5,7,10,.6), rgba(5,7,10,0)); }
.ret { position: absolute; left: 70px; top: 200px; width: 250px; height: 250px; --c: rgba(255,255,255,.85); --l: 22px; --w: 2px;
  background: linear-gradient(var(--c),var(--c)) top left/var(--l) var(--w), linear-gradient(var(--c),var(--c)) top left/var(--w) var(--l),
    linear-gradient(var(--c),var(--c)) top right/var(--l) var(--w), linear-gradient(var(--c),var(--c)) top right/var(--w) var(--l),
    linear-gradient(var(--c),var(--c)) bottom left/var(--l) var(--w), linear-gradient(var(--c),var(--c)) bottom left/var(--w) var(--l),
    linear-gradient(var(--c),var(--c)) bottom right/var(--l) var(--w), linear-gradient(var(--c),var(--c)) bottom right/var(--w) var(--l);
  background-repeat: no-repeat; }
.persona { position: absolute; top: 58px; left: 16px; height: 40px; padding: 0 14px 0 5px; border-radius: 20px; display: flex; align-items: center; gap: 9px; font: 600 14px/1 var(--font); }
.persona .av { width: 30px; height: 30px; border-radius: 15px; display: grid; place-items: center; font-size: 16px; background: rgba(255,90,31,.2); box-shadow: inset 0 0 0 1.5px rgba(255,90,31,.6); }
.persona i { width: 14px; height: 14px; color: var(--ink-3); }
.mini { position: absolute; top: 58px; right: 16px; width: 84px; height: 84px; border-radius: 22px; overflow: hidden; }
.mini svg { position: absolute; inset: 0; }
.cmp { position: absolute; top: 152px; right: 38px; width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; }
.cmp i { width: 20px; height: 20px; color: var(--ink); transform: rotate(-20deg); }
.hint { position: absolute; left: 0; right: 0; bottom: 168px; text-align: center; font: 500 14px/1 var(--font); color: rgba(255,255,255,.78); text-shadow: 0 1px 8px rgba(0,0,0,.6); }
.dock { position: absolute; left: 0; right: 0; bottom: 50px; height: 96px; }
.mic { position: absolute; left: 50%; top: 0; width: 96px; height: 96px; margin-left: -48px; border-radius: 50%; padding: 6px;
  background: conic-gradient(from 200deg, rgba(255,90,31,.95), rgba(255,180,120,.7), rgba(255,90,31,.95)); box-shadow: 0 0 30px rgba(255,90,31,.35), 0 12px 30px rgba(0,0,0,.5); }
.mic > div { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 50% 30%, #fff, #e9ebef); display: grid; place-items: center; color: #0b0d12;
  box-shadow: inset 0 -3px 8px rgba(0,0,0,.12), 0 0 0 3px rgba(5,7,10,.9); }
.mic i { width: 34px; height: 34px; color: #111; }
.cam { position: absolute; left: 24px; top: 26px; height: 44px; padding: 0 16px 0 12px; border-radius: 22px; display: flex; align-items: center; gap: 8px; font: 600 14px/1 var(--font); }
.cam i { width: 19px; height: 19px; }
.gal { position: absolute; right: 24px; top: 22px; width: 52px; height: 52px; border-radius: 26px; padding: 3px; }
.gal > div { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; position: relative; }
.gal img { position: absolute; width: 120px; left: -37px; top: -78px; filter: saturate(1.1); }
</style></head>
<body data-persona="architect"><div class="phone">
<img class="scene" src="scene.svg">
<div class="topscrim"></div><div class="scrim"></div>
<div class="ret"></div>
<div class="status"></div>
<div class="persona glass-dark"><span class="av">📐</span>The Architect<i data-i="down"></i></div>
<div class="mini glass-dark"><svg viewBox="0 0 84 84"><rect width="84" height="84" fill="#0d1016"/>
  <path d="M-5 30L90 18M-5 62L90 70M24 -5L34 90M60 -5L52 90" stroke="#2a313d" stroke-width="7"/><path d="M-5 46h95" stroke="#1f3a55" stroke-width="10"/>
  <path d="M44 52l-14-14" stroke="#ff5a1f" stroke-width="2.5" stroke-dasharray="3 3"/><circle cx="30" cy="38" r="4" fill="#ffd166"/>
  <circle cx="44" cy="52" r="10" fill="rgba(76,194,255,.25)"/><circle cx="44" cy="52" r="5" fill="#4cc2ff" stroke="#fff" stroke-width="2"/></svg></div>
<div class="cmp glass-dark"><i data-i="compass"></i></div>
<div class="hint">Hold the mic and ask about what you see</div>
<div class="dock">
  <div class="cam glass"><i data-i="flip"></i>Camera</div>
  <div class="mic"><div><i data-i="micFill"></i></div></div>
  <div class="gal glass"><div><img src="scene.svg"></div></div>
</div>
<div class="home"></div>
</div><script src="common.js"></script></body></html>
