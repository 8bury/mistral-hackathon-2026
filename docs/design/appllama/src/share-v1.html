<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* Shareable answer card, 1080x1920 (story format). Photo top w/ highlight, quote card, brand footer. */
html, body { width: 1080px; height: 1920px; }
.wrap { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #05070a; }
.photo { position: absolute; left: 60px; top: 150px; width: 960px; height: 1100px; border-radius: 64px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.6); border: 2px solid rgba(255,255,255,.1); }
.photo img { position: absolute; left: 0; top: -280px; width: 960px; height: 2078px; object-fit: cover; }
.photo .spot { position: absolute; inset: 0; background: radial-gradient(circle at 480px 532px, rgba(5,7,10,0) 0 190px, rgba(5,7,10,.7) 480px); }
.photo .box { position: absolute; left: 325px; top: 377px; width: 310px; height: 310px; border-radius: 52px; border: 4px solid #fff; box-shadow: 0 0 60px rgba(255,90,31,.5); }
.photo .pin { left: 480px; top: 532px; transform: scale(2.2); }
.photo .lbl { position: absolute; left: 50%; top: 280px; transform: translateX(-50%); height: 72px; padding: 0 30px; border-radius: 36px; display: flex; align-items: center; gap: 14px; font: 600 32px/1 var(--font); }
.photo .lbl b { width: 16px; height: 16px; border-radius: 8px; background: #ff5a1f; box-shadow: 0 0 16px #ff5a1f; }
.top { position: absolute; top: 64px; left: 72px; right: 72px; display: flex; justify-content: space-between; align-items: center; font: 600 30px/1 var(--font); color: var(--ink-2); }
.top .brand { display: flex; align-items: center; gap: 16px; color: #fff; font-weight: 700; font-size: 34px; }
.top .brand b { width: 44px; height: 44px; border-radius: 14px; background: conic-gradient(from 200deg, #d62828, #ff5a1f, #8e1b1b, #d62828); }
.card { position: absolute; left: 60px; right: 60px; top: 1170px; border-radius: 56px; padding: 56px 60px 60px; }
.who { display: flex; align-items: center; gap: 20px; font: 600 30px/1 var(--font); color: #ff7a45; }
.who .av { width: 72px; height: 72px; border-radius: 36px; display: grid; place-items: center; font-size: 40px; background: rgba(255,90,31,.2); box-shadow: inset 0 0 0 3px rgba(255,90,31,.6); }
.q { margin-top: 36px; font: italic 400 36px/1.3 var(--font); color: var(--ink-2); }
.a { margin-top: 22px; font: 600 50px/1.25 var(--font); letter-spacing: -0.02em; color: #fff; }
.a span { color: #ff7a45; }
.foot { position: absolute; left: 72px; right: 72px; bottom: 70px; display: flex; justify-content: space-between; align-items: center; font: 500 28px/1 var(--font); color: var(--ink-3); }
.foot .qr { width: 92px; height: 92px; border-radius: 18px; background:
  repeating-linear-gradient(90deg, #fff 0 8px, transparent 8px 16px), repeating-linear-gradient(0deg, #fff 0 8px, transparent 8px 20px); opacity: .85; mix-blend-mode: screen; }
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand"><b></b>Vysta</div><span>Paris · 21 Nov</span></div>
<div class="photo"><img src="scene.svg"><div class="spot"></div><div class="box"></div><div class="pin"></div>
  <div class="lbl glass-dark"><b></b>Rose window</div></div>
<div class="card glass-dark">
  <div class="who"><span class="av">📐</span>The Architect says</div>
  <div class="q">“What's that big round window?”</div>
  <div class="a">A 9.6&nbsp;m wheel of stone tracery: <span>the spokes carry the glass</span>, so the wall can be almost all light.</div>
</div>
<div class="foot"><span>Point. Ask. Listen.</span><span>Vysta City Guide</span></div>
</div><script src="common.js"></script></body></html>
