<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* v2 — full-screen character carousel: hero card per persona, neighbours peek, voice preview, accent CTA */
.bg { position: absolute; inset: -30px; filter: blur(24px) brightness(.35) saturate(1.3); }
.tint { position: absolute; inset: 0; background: radial-gradient(80% 50% at 50% 40%, rgba(142,27,27,.45), transparent 70%); }
.top { position: absolute; top: 62px; left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; }
.lang { height: 34px; padding: 3px; border-radius: 17px; display: flex; }
.lang span { padding: 0 12px; border-radius: 14px; font: 600 13px/28px var(--font); color: var(--ink-3); }
.lang .on { background: rgba(255,255,255,.16); color: #fff; }
.skip { font: 500 15px/1 var(--font); color: var(--ink-2); }
h1 { position: absolute; top: 120px; left: 0; right: 0; text-align: center; font: 700 28px/1.1 var(--font); letter-spacing: -0.03em; }
h1 small { display: block; margin-top: 8px; font: 400 15px/1.3 var(--font); letter-spacing: 0; color: var(--ink-2); }
.card { position: absolute; top: 218px; width: 270px; height: 420px; border-radius: 32px; overflow: hidden; border: 1px solid var(--hair-2); box-shadow: var(--shadow); }
.card.main { left: 60px; box-shadow: 0 30px 80px rgba(142,27,27,.45), 0 10px 30px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.18); }
.card.l { left: -232px; transform: scale(.88); opacity: .55; }
.card.r { left: 352px; transform: scale(.88); opacity: .55; }
.art { height: 230px; display: grid; place-items: center; font-size: 110px; position: relative; }
.art::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 80px; background: linear-gradient(transparent, rgba(12,10,12,1)); }
.body { position: absolute; left: 0; right: 0; bottom: 0; top: 230px; background: rgb(12,10,12); padding: 0 22px; }
.nm { font: 700 24px/1.1 var(--font); letter-spacing: -0.02em; }
.tg { margin-top: 6px; font: 500 14px/1.3 var(--font); color: var(--accent-text); }
.qt { margin-top: 14px; font: italic 400 15px/1.4 var(--font); color: var(--ink-2); }
.voice { position: absolute; left: 22px; bottom: 20px; height: 36px; padding: 0 14px 0 6px; border-radius: 18px; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.07); border: 1px solid var(--hair); font: 600 13px/1 var(--font); }
.voice .c { width: 26px; height: 26px; border-radius: 13px; background: rgba(224,128,106,.2); display: grid; place-items: center; color: var(--accent-text); }
.voice i { width: 14px; height: 14px; }
.dots { position: absolute; top: 660px; left: 0; right: 0; display: flex; gap: 6px; justify-content: center; }
.dots s { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); }
.dots .on { width: 20px; background: #fff; }
.cta { position: absolute; left: 20px; right: 20px; bottom: 44px; height: 56px; border-radius: 28px; background: linear-gradient(180deg, #a92626, #8e1b1b); color: #f3e9d2; display: grid; place-items: center; font: 650 17px/1 var(--font);
  box-shadow: 0 12px 30px rgba(142,27,27,.55), inset 0 1px 0 rgba(255,255,255,.25); }
</style></head>
<body data-persona="historian"><div class="phone">
<img class="scene bg" src="scene.svg"><div class="tint"></div>
<div class="status"></div>
<div class="top"><div class="lang glass-dark"><span class="on">English</span><span>Español</span></div><span class="skip">Skip</span></div>
<h1>Who's walking with you?<small>Swipe to meet your guides</small></h1>
<div class="card l"><div class="art" style="background:linear-gradient(160deg,#ff8a50,#b83a0c)">📐</div><div class="body"></div></div>
<div class="card main"><div class="art" style="background:radial-gradient(circle at 50% 40%,#c94a3a,#5a0f0f 70%)">📜</div>
  <div class="body"><div class="nm">The Historian</div><div class="tg">Dates, patrons, why it matters</div>
    <div class="qt">“Every stone in this city was paid for by someone. Let me tell you who.”</div>
    <div class="voice"><span class="c"><i data-i="speaker"></i></span>Hear a sample</div></div></div>
<div class="card r"><div class="art" style="background:linear-gradient(160deg,#ff5a5a,#8f1414)">💂</div><div class="body"></div></div>
<div class="dots"><s></s><s class="on"></s><s></s></div>
<div class="cta">Walk with the Historian</div>
<div class="home"></div>
</div><script src="common.js"></script></body></html>
